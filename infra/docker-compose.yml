name: resolveai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolveai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
      POSTGRES_DB: resolveai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai -d resolveai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resolveai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

