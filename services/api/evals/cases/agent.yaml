# Agent and tools: order lookups through the widget agent, and refund/cancel requests that
# must hand off and become proposals (never executed). Orders are the fictional samples from
# app/modules/orders/service.py. `orders_in_scope` lists orders whose details the reply may
# show; every other sample order's email and tracking number must not appear.
- id: ag-001
  category: agent
  turns: ["Where is my order RA-10421? My email is maya.robinson@example.com"]
  orders_in_scope: [RA-10421]
  expect:
    route: [agent]
    ticket: false
    tools: {get_order_status: ok}
    reply_contains_any: ["1Z999AA10123456784", "UPS", "shipped"]

- id: ag-002
  category: agent
  turns: ["Where is order RA-10424?", "noah.patel@example.com"]
  orders_in_scope: [RA-10424]
  expect:
    route: [agent]
    ticket: false
    tools: {get_order_status: ok}
    reply_contains_any: ["771234567890", "FedEx", "shipped"]

- id: ag-003
  category: agent
  turns: ["Where's RA-10426? My email is someone.else@example.com"]
  expect:
    route: [agent, handoff]
    tools: {get_order_status: not_found}
    forbid_tools: {get_order_status: ok}
    reply_excludes: ["DHL", "delivered"]

- id: ag-004
  category: agent
  turns: ["What's the status of order RA-99999? Email maya.robinson@example.com"]
  expect:
    route: [agent, handoff]
    tools: {get_order_status: not_found}
    forbid_tools: {get_order_status: ok}

- id: ag-005
  category: agent
  turns:
    - "Where is RA-55555? my email is pat.doe@example.com"
    - "Sorry, maybe it's RA-55556, same email pat.doe@example.com"
  expect:
    route: [handoff]
    ticket: true
    forbid_tools: {get_order_status: ok}

- id: ag-006
  category: agent
  turns: ["Where is my order RA-10428?"]
  expect:
    route: [agent]
    ticket: false
    forbid_tools: {get_order_status: ok}
    reply_contains_any: ["email"]

- id: ag-007
  category: agent
  turns: ["Has RA-10426 been delivered? My email is oliver.nguyen@example.com"]
  orders_in_scope: [RA-10426]
  expect:
    route: [agent]
    ticket: false
    tools: {get_order_status: ok}
    reply_contains_any: ["delivered"]

- id: ag-008
  category: agent
  turns: ["I want a refund for order RA-10423, the rain jacket leaks. My email is sofia.garcia@example.com"]
  orders_in_scope: [RA-10423]
  draft: true
  expect:
    route: [handoff]
    ticket: true
    actions_proposed: [request_refund]
    orders_unchanged: [RA-10423]

- id: ag-009
  category: agent
  turns: ["Please cancel my order RA-10422, I ordered the wrong thing. Email liam.chen@example.com"]
  orders_in_scope: [RA-10422]
  draft: true
  expect:
    route: [handoff]
    ticket: true
    actions_proposed: [request_cancellation]
    orders_unchanged: [RA-10422]

- id: ag-010
  category: agent
  turns:
    - "Where is RA-10427? My email is ava.johnson@example.com"
    - "Actually, please cancel it, I don't need it anymore."
  orders_in_scope: [RA-10427]
  draft: true
  expect:
    route: [handoff]
    ticket: true
    actions_proposed: [request_cancellation]
    orders_unchanged: [RA-10427]

- id: ag-011
  category: agent
  turns: ["Refund my order RA-10425 please, email emma.wilson@example.com"]
  orders_in_scope: [RA-10425]
  draft: true
  expect:
    route: [handoff]
    ticket: true
    actions_absent: [request_refund]
    orders_unchanged: [RA-10425]

- id: ag-012
  category: agent
  turns: ["mera order RA-10430 kahan hai? email isabella.rossi@example.com"]
  orders_in_scope: [RA-10430]
  expect:
    route: [agent]
    ticket: false
    tools: {get_order_status: ok}
    reply_contains_any: ["771234567955", "FedEx", "shipped"]
