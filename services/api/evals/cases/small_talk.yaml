# Small talk and off-topic: a short polite reply, never a ticket, never an answer to the
# off-topic question itself.
- id: st-001
  category: small_talk
  turns: ["who is Ambani?"]
  expect:
    route: [small_talk]
    ticket: false
    max_reply_chars: 220
    reply_excludes: ["Reliance", "billionaire", "Mukesh"]

