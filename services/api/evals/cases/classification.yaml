# Classification cases: the latest message (+ optional earlier turns) -> intent, priority,
# needs_human. `priority` lists every acceptable value. Holdout cases live in
# classification_holdout.yaml and are not used while writing classifier prompts.
- id: cls-001
  category: classification
  lang: en
  message: "hi there"
  expect: {intent: greeting, priority: [low], needs_human: false}

- id: cls-002
  category: classification
  lang: en
  message: "thanks so much, that's all I needed!"
  expect: {intent: thanks, priority: [low], needs_human: false}

- id: cls-003
  category: classification
  lang: en
  message: "Where is my order RA-10421? It said it shipped on Monday."
  expect: {intent: order_status, priority: [normal], needs_human: false}

- id: cls-004
  category: classification
  lang: en
  message: "can u tell me when RA-10427 will arrive"
  expect: {intent: order_status, priority: [normal, low], needs_human: false}

- id: cls-005
  category: classification
  lang: en
  message: "I need my order RA-10430 by Friday for my brother's wedding, will it make it in time??"
